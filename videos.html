<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Manifest & iOS Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Coaching App">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lectures</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plyr CSS for Video Cloaking -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        #protected-content { display: none; }
        .video-btn { cursor: pointer; }
    </style>
</head>
<body class="bg-light">

    <!-- Mini Loading Container -->
    <div id="loading-screen" class="d-flex justify-content-center align-items-center rounded shadow" 
         style="width: 100px; height: 100px; background: rgba(255,255,255,0.9); position: fixed; top: 20px; right: 20px; z-index: 9999; transition: opacity 0.5s ease;">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          loader.style.opacity = '0';
          setTimeout(() => { loader.classList.add('d-none'); }, 500);
        }, 2000); 
      });
    </script>

    <!-- Protected Content -->
    <div id="protected-content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
            <div>
                <a class="navbar-brand fw-bold" href="dashboard.html">Coaching Portal</a>
                <a href="dashboard.html" class="btn btn-sm btn-outline-light ms-3">← Back to Dashboard</a>
            </div>
            <div class="d-flex align-items-center">
                <!-- Beautiful Profile Chip -->
                <div class="d-flex align-items-center me-3 bg-secondary bg-opacity-50 rounded-pill pe-3 py-1 ps-1 shadow-sm">
                    <img id="user-pic" src="" alt="Profile" class="rounded-circle me-2" width="28" height="28" style="display: none; object-fit: cover;">
                    <span id="user-name" class="text-white fw-bold small"></span>
                </div>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm">Log Out</button>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row">
                <!-- LEFT: Secure Cloaked Video Player -->
                <div class="col-lg-8 mb-4">
                    <div class="plyr__video-embed" id="player">
                        <iframe 
                            src="https://www.youtube.com/embed/4LDo9I6IQes?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1" 
                            allowfullscreen allowtransparency allow="autoplay">
                        </iframe>
                    </div>
                </div>

                <!-- RIGHT: Custom Playlist Buttons -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0">Class Recordings</h5>
                        </div>
                        <div class="list-group list-group-flush" id="video-playlist">
                            <button class="list-group-item list-group-item-action active video-btn" data-vid="4LDo9I6IQes">Class 1: Geomorphology</button>
                            <button class="list-group-item list-group-item-action video-btn" data-vid="HP15Zr8Ysso">Class 2: Geomorphology</button>
                            <button class="list-group-item list-group-item-action video-btn" data-vid="eDwCFqDvar8">Class 3: Cultural</button>
                            <button class="list-group-item list-group-item-action video-btn" data-vid="xYdMGISwCGc">Class 4: Social</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Plyr JS & Playlist Logic -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const player = new Plyr('#player');
        const videoButtons = document.querySelectorAll('.video-btn');

        videoButtons.forEach(button => {
            button.addEventListener('click', function() {
                videoButtons.forEach(btn => btn.classList.remove('active', 'bg-danger', 'text-white'));
                this.classList.add('active', 'bg-danger', 'text-white');
                const videoId = this.getAttribute('data-vid');
                player.source = {
                    type: 'video',
                    sources: [{ src: videoId, provider: 'youtube' }]
                };
            });
        });
    </script>

    <!-- Firebase Security Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
          authDomain: "coaching-portal-ugcnet.firebaseapp.com",
          projectId: "coaching-portal-ugcnet",
          storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
          messagingSenderId: "972456665369",
          appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
          measurementId: "G-2PEYHGZ6QL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const googleSheetApiUrl = "https://script.google.com/macros/s/AKfycbxcq8R_xv6IJNT3m_b_k5iT6oOQzb8g-e2SRO0UZyYUXTTnCxXeyTwtqR1ltYeF3bos/exec";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetch(googleSheetApiUrl + "?email=" + encodeURIComponent(user.email))
                    .then(response => response.json())
                    .then(data => {
                        if (data.approved) {
                            document.getElementById('protected-content').style.display = 'block';
                            
                            // Map Google Profile Data
                            document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
                            if (user.photoURL) {
                                document.getElementById('user-pic').src = user.photoURL;
                                document.getElementById('user-pic').style.display = 'block';
                            }

                            // 1. PASTE YOUR NEW TRACKING URL HERE
const trackingApiUrl = "https://script.google.com/macros/s/AKfycbzycUPuvbzVmv6jvZvNHryjG3N2D5MsxCJ_kCPolqJNM1UBKfBVvGu3g5vVEns-oOGO/exec";

// 2. The Tracking Engine
function trackActivity(user, action, details) {
    fetch(trackingApiUrl, {
        method: 'POST',
        body: JSON.stringify({
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            action: action,
            details: details
        })
    }).catch(err => console.log("Tracking request skipped"));
}

// 3. Log that they opened the page
trackActivity(user, "Page Visit", "Video Lectures");

// 4. Listen for specific video clicks
const videoBtns = document.querySelectorAll('.video-btn');
videoBtns.forEach(button => {
    button.addEventListener('click', function() {
        // Sends the exact text of the button they clicked (e.g., "Class 1: Geomorphology")
        trackActivity(user, "Watched Video", this.innerText);
    });
});
                        } else {
                            signOut(auth).then(() => { window.location.href = "index.html"; });
                        }
                    });
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "index.html"; });
        });
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
