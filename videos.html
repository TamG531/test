<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lectures</title>
    <!-- Bootstrap for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* CRITICAL: Hide the content completely until Firebase confirms identity */
        #protected-content { display: none; }
    </style>
</head>
<body class="bg-light">

    <!-- Loading Spinner -->
    <div id="loading-screen" class="vh-100 d-flex justify-content-center align-items-center">
        <div class="spinner-border text-danger" role="status"></div>
    </div>

    <!-- Protected Content -->
    <div id="protected-content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
            <div>
                <a class="navbar-brand fw-bold" href="dashboard.html">Coaching Portal</a>
                <a href="dashboard.html" class="btn btn-sm btn-outline-light ms-3">← Back to Dashboard</a>
            </div>
            <div class="d-flex align-items-center">
                <span id="user-email" class="text-white me-3"></span>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm">Log Out</button>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <h2 class="mb-4">Class Recordings Playlist</h2>
                    
                    <!-- Native YouTube Playlist -->
                    <div class="card p-3 shadow-sm border-0">
                        <div class="ratio ratio-16x9">
                            <!-- Your Playlist ID is already injected here -->
                            <iframe 
                                src="https://www.youtube.com/embed/videoseries?list=PLihBx7xIqR3PrYbGw9LZLHRk3zjjerwIi" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Security Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase Keys
        const firebaseConfig = {
          apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
          authDomain: "coaching-portal-ugcnet.firebaseapp.com",
          projectId: "coaching-portal-ugcnet",
          storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
          messagingSenderId: "972456665369",
          appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
          measurementId: "G-2PEYHGZ6QL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Check: Is the user logged in?
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
            } else {
                window.location.href = "index.html"; // Redirect to login
            }
        });

        // Log Out Button Logic
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
