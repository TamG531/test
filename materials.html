<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Hide content until Firebase confirms identity */
        #protected-content { display: none; }
    </style>
</head>
<body class="bg-light">

  <!-- Mini Loading Container -->
<div id="loading-screen" class="d-flex justify-content-center align-items-center rounded shadow" 
     style="width: 100px; height: 100px; background: rgba(255,255,255,0.9); position: fixed; top: 20px; right: 20px; z-index: 9999; transition: opacity 0.5s ease;">
  
  <!-- Smaller Bootstrap Spinner using .spinner-border-sm -->
  <div class="spinner-border spinner-border-sm text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- JavaScript to fade and disappear -->
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loading-screen');
      
      // Step 1: Smoothly fade it out using CSS transitions
      loader.style.opacity = '0';
      
      // Step 2: Completely remove it from the page layout after it finishes fading
      setTimeout(() => {
        loader.classList.add('d-none');
      }, 500); // Matches the 0.5s transition time
      
    }, 2000); // Keeps it visible for 2 seconds
  });
</script>

  <!-- Protected Content -->
    <div id="protected-content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
            <div>
                <a class="navbar-brand fw-bold" href="dashboard.html">Coaching Portal</a>
                <a href="dashboard.html" class="btn btn-sm btn-outline-light ms-3">← Back to Dashboard</a>
            </div>
            <div class="d-flex align-items-center">
                <span id="user-email" class="text-white me-3"></span>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm">Log Out</button>
            </div>
        </nav>

        <div class="container mt-5 mb-5">
            <h2 class="mb-4">Study Materials & Notes</h2>
            
            <!-- Google Drive Folder Embed -->
            <div class="card p-4 shadow-sm border-0">
                <div style="width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 5px; overflow: hidden;">
                    <!-- Your Google Drive Folder ID is injected here -->
                    <iframe 
                        src="https://drive.google.com/embeddedfolderview?id=1fjV-M1ygBMA_z9obtI93aCfkETSO9jC3#list" 
                        width="100%" 
                        height="100%" 
                        style="border: none;">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Security Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase Keys
        const firebaseConfig = {
          apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
          authDomain: "coaching-portal-ugcnet.firebaseapp.com",
          projectId: "coaching-portal-ugcnet",
          storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
          messagingSenderId: "972456665369",
          appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
          measurementId: "G-2PEYHGZ6QL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
            } else {
                window.location.href = "index.html"; // Redirect to login
            }
        });

        // Log Out Button
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
