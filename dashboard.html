<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Manifest & iOS Support -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Coaching App">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <!-- Bootstrap for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Hide content until Firebase confirms identity */
        #protected-content { display: none; }
        
        /* Make the menu cards look clickable and nice on hover */
        .menu-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: block;}
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body class="bg-light">

<!-- Mini Loading Container -->
<div id="loading-screen" class="d-flex justify-content-center align-items-center rounded shadow" 
     style="width: 100px; height: 100px; background: rgba(255,255,255,0.9); position: fixed; top: 20px; right: 20px; z-index: 9999; transition: opacity 0.5s ease;">
  
  <!-- Smaller Bootstrap Spinner using .spinner-border-sm -->
  <div class="spinner-border spinner-border-sm text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- JavaScript to fade and disappear -->
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loading-screen');
      
      // Step 1: Smoothly fade it out using CSS transitions
      loader.style.opacity = '0';
      
      // Step 2: Completely remove it from the page layout after it finishes fading
      setTimeout(() => {
        loader.classList.add('d-none');
      }, 500); // Matches the 0.5s transition time
      
    }, 2000); // Keeps it visible for 2 seconds
  });
</script>

    <!-- Protected Content (Main Menu) -->
    <div id="protected-content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
            <a class="navbar-brand" href="#">Coaching Portal</a>
            <div class="d-flex align-items-center">
                <span id="user-email" class="text-white me-3"></span>
                <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
            </div>
        </nav>

        <div class="container mt-5">
            <h2 class="mb-4 text-center">Welcome to Your Dashboard</h2>
            
            <!-- Three Button Options -->
            <div class="row g-4 justify-content-center mt-3">
                
                <!-- Option 1: Videos -->
                <div class="col-md-4">
                    <a href="videos.html" class="card p-4 shadow-sm border-0 h-100 menu-card text-center">
                        <h1 class="display-4 text-danger mb-3">🎥</h1>
                        <h4>Video Lectures</h4>
                        <p class="text-muted">Watch recorded classes and daily lessons.</p>
                    </a>
                </div>

                <!-- Option 2: Study Materials -->
                <div class="col-md-4">
                    <a href="materials.html" class="card p-4 shadow-sm border-0 h-100 menu-card text-center">
                        <h1 class="display-4 text-primary mb-3">📚</h1>
                        <h4>Study Materials</h4>
                        <p class="text-muted">Access PDF notes and chapter reading.</p>
                    </a>
                </div>

                <!-- Option 3: Mock Test -->
                <div class="col-md-4">
                    <a href="mocktest.html" class="card p-4 shadow-sm border-0 h-100 menu-card text-center">
                        <h1 class="display-4 text-success mb-3">📝</h1>
                        <h4>Mock Tests</h4>
                        <p class="text-muted">Take NTA-style practice exams.</p>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase Security Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 1. YOUR FIREBASE KEYS
        const firebaseConfig = {
          apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
          authDomain: "coaching-portal-ugcnet.firebaseapp.com",
          projectId: "coaching-portal-ugcnet",
          storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
          messagingSenderId: "972456665369",
          appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
          measurementId: "G-2PEYHGZ6QL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 2. PASTE YOUR LOGIN GOOGLE APPS SCRIPT URL HERE
        const googleSheetApiUrl = "https://script.google.com/macros/s/AKfycbxcq8R_xv6IJNT3m_b_k5iT6oOQzb8g-e2SRO0UZyYUXTTnCxXeyTwtqR1ltYeF3bos/exec";

        // Security Check: Is the user logged in AND on the spreadsheet?
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is logged into Firebase, now double-check the database
                fetch(googleSheetApiUrl + "?email=" + encodeURIComponent(user.email))
                    .then(response => response.json())
                    .then(data => {
                        if (data.approved) {
                            // VERIFIED: Hide spinner, show content
                            document.getElementById('loading-screen').style.display = 'none';
                            document.getElementById('protected-content').style.display = 'block';
                            document.getElementById('user-email').innerText = user.email;
                        } else {
                            // REJECTED: Email was removed from sheet. Force sign out.
                            signOut(auth).then(() => {
                                window.location.href = "index.html";
                            });
                        }
                    })
                    .catch(err => {
                        console.error("Database check failed:", err);
                        alert("Error verifying your account status.");
                    });
            } else {
                // Not logged in at all
                window.location.href = "index.html";
            }
        });

        // Log Out Button Logic
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
    <!-- PWA Service Worker Registration -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'));
    }
</script>
</body>
</html>
