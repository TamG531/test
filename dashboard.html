<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <!-- Bootstrap for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plyr CSS for Video Cloaking -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* CRITICAL: Hide the dashboard content completely until Firebase confirms identity */
        #protected-content { display: none; }
    </style>
</head>
<body class="bg-light">

    <!-- Loading Spinner (Visible on load) -->
    <div id="loading-screen" class="vh-100 d-flex justify-content-center align-items-center">
        <div class="spinner-border text-danger" role="status"></div>
    </div>

    <!-- Protected Content (Hidden by default) -->
    <div id="protected-content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-dark bg-dark px-4">
            <a class="navbar-brand" href="#">Coaching Portal</a>
            <div class="d-flex align-items-center">
                <!-- Displays the student's email -->
                <span id="user-email" class="text-white me-3"></span>
                <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
            </div>
        </nav>

        <div class="container mt-5">
            <h2>Today's Class</h2>
            <hr>
            
            <div class="row mt-4">
                <!-- Cloaked YouTube Video -->
                <div class="col-md-8 mb-4">
                    <div class="plyr__video-embed" id="player">
                        <!-- Replace "bTqVqk7FSmY" with your unlisted YouTube video ID -->
                        <iframe src="https://www.youtube.com/embed/bTqVqk7FSmY?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>
                    </div>
                </div>
                
                <!-- Action Panel -->
                <div class="col-md-4">
                    <div class="card p-4 shadow-sm border-0">
                        <h4 class="mb-3">Study Materials</h4>
                        <!-- Link this to your NTA mock test HTML file -->
                        <a href="mocktest.html" class="btn btn-danger w-100 mb-3 py-2">Take NTA Mock Test</a>
                        
                        <!-- Link this to your Google Drive PDF preview -->
                        <a href="#" target="_blank" class="btn btn-outline-dark w-100 py-2">View PDF Notes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Plyr JS to run the video cloaking -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const player = new Plyr('#player');
    </script>

    <!-- Firebase Security Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // TODO: PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
  authDomain: "coaching-portal-ugcnet.firebaseapp.com",
  projectId: "coaching-portal-ugcnet",
  storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
  messagingSenderId: "972456665369",
  appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
  measurementId: "G-2PEYHGZ6QL"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Check: Is the user logged in?
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // VERIFIED: Hide spinner, show content, display email
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
            } else {
                // REJECTED: Redirect immediately to login page
                window.location.href = "index.html";
            }
        });

        // Log Out Button Logic
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

            style="border: none; position: absolute; top: -50px; left: 0;"
            allow="autoplay">
        </iframe>
        
    </div>
</div>
    </script>
</body>
</html>
