<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <!-- Bootstrap for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plyr CSS for Video Cloaking -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* CRITICAL: Hide the dashboard content completely until Firebase confirms identity */
        #protected-content { display: none; }
    </style>
</head>
<body class="bg-light">

    <!-- Loading Spinner (Visible on load) -->
    <div id="loading-screen" class="vh-100 d-flex justify-content-center align-items-center">
        <div class="spinner-border text-danger" role="status"></div>
    </div>

    <!-- Protected Content (Hidden by default) -->
    <div id="protected-content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-dark bg-dark px-4">
            <a class="navbar-brand" href="#">Coaching Portal</a>
            <div class="d-flex align-items-center">
                <!-- Displays the student's email -->
                <span id="user-email" class="text-white me-3"></span>
                <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
            </div>
        </nav>

        <div class="container mt-5">
            <h2>Today's Class</h2>
            <hr>
            
            <div class="row mt-4">
                <!-- LEFT COLUMN: Video Player & PDF Viewer -->
                <div class="col-md-8 mb-4">
                    
                    <!-- Cloaked YouTube Video Player -->
                    <div class="plyr__video-embed" id="player">
                        <iframe id="main-video-frame" src="https://www.youtube.com/embed/4LDo9I6IQes?origin=https://plyr.io&amp;iv_load_policy=3&amp;modestbranding=1&amp;playsinline=1&amp;showinfo=0&amp;rel=0&amp;enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>
                    </div>

                    <!-- Secure PDF Viewer -->
                    <div class="card p-4 shadow-sm border-0 mt-4">
                        <h4 class="mb-3">Chapter Notes</h4>
                        <!-- This wrapper cuts off the top 50px of the iframe to hide the pop-out button -->
                        <div style="width: 100%; height: 500px; overflow: hidden; position: relative; border: 1px solid #ddd; border-radius: 5px;">
                            <!-- TODO: Replace the src with your actual PDF FILE link -->
                            <iframe 
                                src="https://drive.google.com/drive/folders/1fjV-M1ygBMA_z9obtI93aCfkETSO9jC3?usp=drive_link/preview" 
                                width="100%" 
                                height="550px" 
                                style="border: none; position: absolute; top: -50px; left: 0;"
                                allow="autoplay">
                            </iframe>
                        </div>
                    </div>

                </div>
                
                <!-- RIGHT COLUMN: Playlist & Action Panel -->
                <div class="col-md-4">
                    
                    <!-- VIDEO PLAYLIST MENU -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0">Class Recordings</h5>
                        </div>
                        <div class="list-group list-group-flush" id="video-playlist">
                            <!-- Notice the data-vid attribute holds the 11-character YouTube ID -->
                            <button class="list-group-item list-group-item-action active video-btn" data-vid="HP15Zr8Ysso">1. PYQ Oceanography</button>
                            <button class="list-group-item list-group-item-action video-btn" data-vid="dQw4w9WgXcQ">Class 2: Geomorphology</button>
                            <button class="list-group-item list-group-item-action video-btn" data-vid="jNQXAC9IVRw">Class 3: Climatology</button>
                        </div>
                    </div>

                    <!-- Study Materials Panel -->
                    <div class="card p-4 shadow-sm border-0">
                        <h4 class="mb-3">Practice & Test</h4>
                        <!-- Link this to your NTA mock test HTML file -->
                        <a href="mocktest.html" class="btn btn-danger w-100 mb-3 py-2">Take NTA Mock Test</a>
                    </div>

                </div>
            </div>
        </div>
    </div> <!-- Closes the protected-content div -->

    <!-- Plyr JS & Playlist Logic -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        // Initialize the cloaked video player
        const player = new Plyr('#player');

        // Logic to make the playlist buttons change the video
        const videoButtons = document.querySelectorAll('.video-btn');
        const videoFrame = document.getElementById('main-video-frame');

        videoButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove red active color from all buttons
                videoButtons.forEach(btn => btn.classList.remove('active', 'bg-danger', 'text-white'));
                // Add red active color to clicked button
                this.classList.add('active', 'bg-danger', 'text-white');
                // Get YouTube ID and swap video
                const videoId = this.getAttribute('data-vid');
                videoFrame.src = `https://www.youtube.com/embed/${videoId}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1`;
            });
        });
    </script>

    <!-- Single Firebase Security Logic Block -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase Keys
        const firebaseConfig = {
          apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
          authDomain: "coaching-portal-ugcnet.firebaseapp.com",
          projectId: "coaching-portal-ugcnet",
          storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
          messagingSenderId: "972456665369",
          appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
          measurementId: "G-2PEYHGZ6QL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Check: Is the user logged in?
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // VERIFIED: Hide spinner, show content, display email
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
            } else {
                // REJECTED: Redirect immediately to login page
                window.location.href = "index.html";
            }
        });

        // Log Out Button Logic
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
