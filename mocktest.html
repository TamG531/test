<!DOCTYPE html>
<html>
<head>
    <!-- 1. PASTE YOUR ORIGINAL <head> TAGS, CSS LINKS, AND <title> HERE -->
    
    <style>
        /* CRITICAL SECURITY: Hide the exam completely until Firebase verifies identity */
        #all { display: none; }
        #auth-loading { height: 100vh; display: flex; justify-content: center; align-items: center; font-size: 20px; font-family: sans-serif; }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="auth-loading">Verifying secure session...</div>

    <!-- The wrapper for your entire NTA exam -->
    <div id="all">
        <!-- 
          2. PASTE YOUR ENTIRE ORIGINAL EXAM HTML HERE 
          (Everything from your original <div class="top-bar"> down to the </div> closing #all)
        -->
    </div>

    <!-- 3. PASTE YOUR ORIGINAL JAVASCRIPT LINKS HERE (jQuery, Bootstrap, Begin.js, etc.) -->

    <!-- 4. ADD FIREBASE SECURITY & GOOGLE SHEETS SUBMISSION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // TODO: PASTE YOUR FIREBASE CONFIG KEYS HERE
const firebaseConfig = {
  apiKey: "AIzaSyDRifIZcxUY_e2rYMhUW8T-q6v9hqB6y0Q",
  authDomain: "coaching-portal-ugcnet.firebaseapp.com",
  projectId: "coaching-portal-ugcnet",
  storageBucket: "coaching-portal-ugcnet.firebasestorage.app",
  messagingSenderId: "972456665369",
  appId: "1:972456665369:web:90ec17b9d3d75887ef2588",
  measurementId: "G-2PEYHGZ6QL"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let currentUserEmail = "";
        let currentUserName = "";

        // Security Check: Is the user logged in?
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // VERIFIED: Show the exam, hide the loading screen
                document.getElementById('auth-loading').style.display = 'none';
                document.getElementById('all').style.display = 'block';
                
                // Store user details for the final submission
                currentUserEmail = user.email;
                currentUserName = user.displayName || "Student";

                // INJECT NAME INTO UI: Find your name placeholder and update it
                // Make sure your HTML has id="candidate-name" added to the span: 
                // <span id="candidate-name" style="color: #f7931e;">[Your Name]</span>
                const namePlaceholder = document.getElementById('candidate-name');
                if(namePlaceholder) namePlaceholder.innerText = currentUserName;
                
            } else {
                // REJECTED: Redirect immediately to login page
                window.location.href = "index.html";
            }
        });

        // ---------------------------------------------------------
        // SUBMIT TO GOOGLE SHEETS LOGIC
        // ---------------------------------------------------------
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL'; // From Step 3 of the Apps Script guide

        // Listen for clicks on your final "Submit" button
        document.querySelector('.btn-submit-all-answers').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Gather the scores generated by your existing JavaScript
            // (Ensure these IDs match what your Begin.js actually outputs)
            let totalScore = document.getElementById('lblRScore').innerText; 
            let correctAnswers = document.getElementById('lblRTotalCorrect').innerText;
            let wrongAnswers = document.getElementById('lblRTotalWrong').innerText;
            
            // Package the data. The keys must perfectly match your Google Sheet Column Headers
            const formData = new FormData();
            formData.append('Candidate Name', currentUserName);
            formData.append('Email', currentUserEmail);
            formData.append('Total Score', totalScore);
            formData.append('Correct Answers', correctAnswers);
            formData.append('Incorrect Answers', wrongAnswers);
            
            // Send to Google Sheets
            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    // Reveal your Thank You screen (using your existing classes)
                    document.querySelector('.exam-paper').style.display = 'none';
                    document.querySelector('.exam-thankyou').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Submission failed. Please try again.");
                });
        });
    </script>
</body>
</html>
